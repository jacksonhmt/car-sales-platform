<div class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
      <h1 class="fw-bold mb-1">Dashboard</h1>
      <p class="text-muted mb-0">Overview of the customer base.</p>
    </div>
    <a class="btn btn-primary" routerLink="/customers">
      <i class="bi bi-person-plus me-2"></i>Register customer
    </a>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted text-uppercase small mb-2">Registered customers</p>
          @if (loadError()) {
            <p class="text-danger mb-0"><i class="bi bi-exclamation-circle me-1"></i>Unable to load customers.</p>
          } @else if (totalCustomers() === null) {
            <div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div>
          } @else {
            <p class="display-5 fw-bold mb-0">{{ totalCustomers() }}</p>
          }
        </div>
      </div>
    </div>
  </div>
</div>
