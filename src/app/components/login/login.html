<div class="card login-card fade-in">
  <div class="card-body p-5">
    <h3 class="fw-bold mb-1">{{ i18n.t('login.title') }}</h3>
    <p class="text-muted mb-4">{{ i18n.t('login.subtitle') }}</p>

    @if (errorMessage()) {
      <div class="alert theme-danger border-0" role="alert">
        <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>{{ errorMessage() }}
      </div>
    }

    <form id="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">
          {{ i18n.t('login.username') }} <span class="theme-danger">*</span>
        </label>
        <input type="text" id="username" formControlName="username" autocomplete="username"
          class="form-control" [class.is-invalid]="submitted() && f.username.invalid" />
        @if (submitted() && f.username.invalid) {
          <div class="invalid-feedback d-block">
            <small><i class="bi bi-exclamation-circle"></i> {{ i18n.t('login.usernameRequired') }}</small>
          </div>
        }
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">
          {{ i18n.t('login.password') }} <span class="theme-danger">*</span>
        </label>
        <input type="password" id="password" formControlName="password" autocomplete="current-password"
          class="form-control" [class.is-invalid]="submitted() && f.password.invalid" />
        @if (submitted() && f.password.invalid) {
          <div class="invalid-feedback d-block">
            <small><i class="bi bi-exclamation-circle"></i> {{ i18n.t('login.passwordRequired') }}</small>
          </div>
        }
      </div>

      <button id="login-submit" type="submit" class="btn btn-primary w-100">{{ i18n.t('login.submit') }}</button>
    </form>
  </div>
</div>
