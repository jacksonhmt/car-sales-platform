<div class="fade-in">
  <div class="mb-4">
    <h2 class="fw-bold mb-1">{{ i18n.t('settings.title') }}</h2>
    <p class="text-muted mb-0">{{ i18n.t('settings.subtitle') }}</p>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row g-4">
        <div class="col-12 col-md-6">
          <label for="theme" class="form-label">{{ i18n.t('settings.theme') }}</label>
          <select id="theme" class="form-select" [value]="theme.mode()" (change)="onThemeChange($event)">
            @for (option of themeOptions; track option.value) {
              <option [value]="option.value">{{ i18n.t(option.labelKey) }}</option>
            }
          </select>
        </div>

        <div class="col-12 col-md-6">
          <label for="language" class="form-label">{{ i18n.t('settings.language') }}</label>
          <select id="language" class="form-select" [value]="i18n.locale()" (change)="onLanguageChange($event)">
            @for (option of languageOptions; track option.value) {
              <option [value]="option.value">{{ i18n.t(option.labelKey) }}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
