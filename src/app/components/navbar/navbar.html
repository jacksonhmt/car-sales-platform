<nav class="navbar md:navbar-expand fixed-top bg-1 border-bottom">
  <div class="container-fluid">
    <div class="navbar-section">
      <a class="navbar-brand" routerLink="/dashboard">Car Sales Platform</a>
    </div>
    <div class="input-group navbar-search d-none md:d-flex">
      <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
      <input type="search" class="form-control" placeholder="Search" aria-label="Search">
    </div>
    <div class="navbar-section navbar-section-end">
    <ul class="navbar-nav flex-row">
      <li class="nav-item">
        <button class="btn btn-link nav-link px-1 gap-1" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="menu" data-bs-placement="bottom-end" [attr.aria-label]="'Toggle theme (' + theme.mode() + ')'">
          <i class="bi theme-icon-active" [class]="currentTheme().icon" aria-hidden="true"></i>
          <span class="visually-hidden">Toggle theme</span>
          <i class="bi bi-chevron-expand" aria-hidden="true"></i>
        </button>
        <div class="menu border-keyline" id="bd-theme-menu" aria-labelledby="bd-theme" style="--bs-menu-min-width: 8rem;">
          @for (option of themeOptions; track option.value) {
            <button
              type="button"
              class="menu-item"
              [class.active]="theme.mode() === option.value"
              [attr.aria-pressed]="theme.mode() === option.value"
              (click)="theme.setMode(option.value)"
            >
              <i class="bi opacity-50" [class]="option.icon" aria-hidden="true"></i>{{ option.label }}
              <i class="bi bi-check2 ms-auto" [class.d-none]="theme.mode() !== option.value" aria-hidden="true"></i>
            </button>
          }
        </div>
      </li>
    </ul>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    </div>
  </div>
</nav>
<dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
  <div class="drawer-header">
    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
  </div>
  <div class="drawer-body mb-2 md:mb-0">
    <ul class="nav navbar-nav me-auto">
      <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" data-bs-dismiss="drawer"><i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Dashboard</a>
      </li>
      <li class="nav-item">
          <a class="nav-link" routerLink="/customers" routerLinkActive="active" ariaCurrentWhenActive="page" data-bs-dismiss="drawer"><i class="bi bi-people me-1" aria-hidden="true"></i>Customers</a>
      </li>
    </ul>
  </div>
</dialog>
